version: '3.8'

services:
  # ==========================================
  # API Service (NestJS Backend)
  # ==========================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ayantaraz-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Server Configuration
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      
      # API URLs
      - API_URL=${API_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - SITE_URL=${SITE_URL}
      - INTERNAL_API_URL=${INTERNAL_API_URL}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
      
      # Database Configuration
      - DATABASE_URL=${DATABASE_URL}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      
      # Redis Configuration
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_URL=${REDIS_URL}
      
      # JWT Configuration
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION}
      
      # Security Configuration
      - FILE_ENCRYPTION_KEY=${FILE_ENCRYPTION_KEY}
      - SESSION_SECRET=${SESSION_SECRET}
      - ENABLE_CSRF=false
      - ALLOW_ALL_ORIGINS=${ALLOW_ALL_ORIGINS}
      - TRUSTED_ORIGINS=${TRUSTED_ORIGINS}
      
      # Cookie Configuration
      - COOKIE_SECURE=true
      - COOKIE_HTTP_ONLY=true
      - COOKIE_SAME_SITE=lax
      - COOKIE_DOMAIN=${COOKIE_DOMAIN}
      
      # Logging Configuration
      - LOG_LEVEL=${LOG_LEVEL}
      - TZ=Asia/Tehran
      
      # File Upload Configuration
      - MAX_FILE_SIZE=${MAX_FILE_SIZE}
      - UPLOAD_DIR=/app/uploads
      
      # Rate Limiting Configuration
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS}
      - RATE_LIMITER_FAIL_OPEN=true
      
      # OTP Configuration
      - OTP_EXPIRATION_SECONDS=${OTP_EXPIRATION_SECONDS}
      - OTP_MAX_ATTEMPTS=${OTP_MAX_ATTEMPTS}
      - OTP_RESEND_LIMIT=${OTP_RESEND_LIMIT}
      - OTP_RESEND_WINDOW_MINUTES=${OTP_RESEND_WINDOW_MINUTES}
      - OTP_BLOCK_DURATION_MINUTES=${OTP_BLOCK_DURATION_MINUTES}
      
      # Database Pool Configuration
      - DB_POOL_MAX_CONNECTIONS=${DB_POOL_MAX_CONNECTIONS}
      - DB_POOL_MIN_CONNECTIONS=${DB_POOL_MIN_CONNECTIONS}
      - DB_POOL_MAX_REQUESTS_PER_CONNECTION=${DB_POOL_MAX_REQUESTS_PER_CONNECTION}
      - DB_POOL_IDLE_TIMEOUT_MS=${DB_POOL_IDLE_TIMEOUT_MS}
      - DB_POOL_CONNECTION_TIMEOUT_MS=${DB_POOL_CONNECTION_TIMEOUT_MS}
      
      # Health Check Configuration
      - HEALTH_CHECK_INTERVAL=${HEALTH_CHECK_INTERVAL}
    ports:
      - '3001:3001'
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: '100m'
        max-file: '10'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - ayantaraz-network

  # ==========================================
  # Web Service (Next.js Frontend)
  # ==========================================
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: ayantaraz-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Server Configuration
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      
      # API URLs
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - INTERNAL_API_URL=${INTERNAL_API_URL}
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: '100m'
        max-file: '10'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - ayantaraz-network

  # ==========================================
  # PostgreSQL Database
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: ayantaraz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: '100m'
        max-file: '10'
    networks:
      - ayantaraz-network

  # ==========================================
  # Redis Cache
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: ayantaraz-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$REDIS_PASSWORD" ping']
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'
    networks:
      - ayantaraz-network

  # ==========================================
  # Nginx Reverse Proxy (Optional - for production)
  # ==========================================
  nginx:
    image: nginx:1.25-alpine
    container_name: ayantaraz-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - web
    logging:
      driver: json-file
      options:
        max-size: '100m'
        max-file: '10'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ayantaraz-network
    profiles:
      - production

# ==========================================
# Networks
# ==========================================
networks:
  ayantaraz-network:
    driver: bridge

# ==========================================
# Volumes
# ==========================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
