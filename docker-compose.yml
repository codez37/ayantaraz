version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ayantaraz-api
    restart: unless-stopped
    user: "nodejs"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3001
      - API_URL=https://202.133.91.13/api
      - FRONTEND_URL=https://202.133.91.13
      - SITE_URL=https://202.133.91.13
      - INTERNAL_API_URL=http://api:3001/api
      - NEXT_PUBLIC_API_URL=https://202.133.91.13/api
      - NEXT_PUBLIC_SITE_URL=https://202.133.91.13
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public&connection_limit=50&pool_timeout=10&statement_timeout=30000&idle_timeout=60
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_EXPIRATION=15m
      - JWT_REFRESH_EXPIRATION=7d
      - FILE_ENCRYPTION_KEY=${FILE_ENCRYPTION_KEY}
      - SESSION_SECRET=${SESSION_SECRET}
      - SMS_API_KEY=${SMS_API_KEY}
      - SMS_PROVIDER=sms-panel
      - SMS_FROM=ayantaraz
      - ADMIN_PHONE=09133374162,09134292329
      - ALLOW_ALL_ORIGINS=false
      - TRUSTED_ORIGINS=https://202.133.91.13,https://www.ayantaraz.com
      - COOKIE_SECURE=true
      - COOKIE_HTTP_ONLY=true
      - COOKIE_SAME_SITE=lax
      - COOKIE_DOMAIN=202.133.91.13
      - LOG_LEVEL=info
      - TZ=Asia/Tehran
      - MAX_FILE_SIZE=10485760
      - UPLOAD_DIR=/app/uploads
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=100
      - RATE_LIMITER_FAIL_OPEN=true
      - OTP_EXPIRATION_SECONDS=300
      - OTP_MAX_ATTEMPTS=5
      - OTP_RESEND_LIMIT=3
      - OTP_RESEND_WINDOW_MINUTES=10
      - OTP_BLOCK_DURATION_MINUTES=30
      - DB_POOL_MAX_CONNECTIONS=20
      - DB_POOL_MIN_CONNECTIONS=5
      - DB_POOL_MAX_REQUESTS_PER_CONNECTION=50
      - DB_POOL_IDLE_TIMEOUT_MS=10000
      - DB_POOL_CONNECTION_TIMEOUT_MS=10000
      - HEALTH_CHECK_INTERVAL=30000
    ports:
      - '3001:3001'
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.5'
          memory: 1.5G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    mem_limit: 1.5g
    memswap_limit: 1.5g
    logging:
      driver: json-file
      options:
        max-size: '100m'
        max-file: '10'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/api/health']
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 45s
    networks:
      - ayantaraz-network

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: ayantaraz-web
    restart: unless-stopped
    user: "nodejs"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_SITE_URL=https://202.133.91.13
      - NEXT_PUBLIC_API_URL=https://202.133.91.13/api
      - INTERNAL_API_URL=http://api:3001/api
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.3'
          memory: 300M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    mem_limit: 1g
    memswap_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: '100m'
        max-file: '10'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000']
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 45s
    networks:
      - ayantaraz-network

  postgres:
    image: postgres:15-alpine
    container_name: ayantaraz-postgres
    restart: unless-stopped
    user: "postgres"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    mem_limit: 1g
    memswap_limit: 1g
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: '100m'
        max-file: '10'
    networks:
      - ayantaraz-network

  redis:
    image: redis:7-alpine
    container_name: ayantaraz-redis
    restart: unless-stopped
    user: "redis"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    mem_limit: 512m
    memswap_limit: 512m
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a ${REDIS_PASSWORD} ping']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: '100m'
        max-file: '10'
    networks:
      - ayantaraz-network

  nginx:
    image: nginx:alpine
    container_name: ayantaraz-nginx
    restart: unless-stopped
    user: "nginx"
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.2'
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    mem_limit: 256m
    memswap_limit: 256m
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '100m'
        max-file: '10'
    networks:
      - ayantaraz-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  ayantaraz-network:
    driver: bridge
